<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教师节</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 80px 20px;
    }

    h1 {
      margin-bottom: 40px;
    }

    button {
      font-size: 20px;
      padding: 12px 30px;
      margin: 15px;
      cursor: pointer;
    }

    #result {
      margin-top: 35px;
      font-size: 26px;
      font-weight: bold;
      line-height: 1.6;
    }

    #secondQuestion {
      display: none;
      margin-top: 50px;
    }

    .option {
      display: block;
      margin: 15px;
      font-size: 20px;
    }

    .dazai-option {
      cursor: pointer;
    }

    .dazai-crossed {
      color: gray;
      text-decoration: line-through;
    }

    #dazaiMessage {
      display: none;
      margin-top: 8px;
      font-size: 14px;
      color: gray;
    }

    textarea {
      width: min(400px, 85%);
      height: 120px;
      font-size: 16px;
      padding: 10px;
      margin-top: 20px;
    }

    #submitResult {
      margin-top: 25px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>教师节你最想要感谢的是谁？</h1>

  <button onclick="chooseDazai()">太宰治</button>
  <button onclick="chooseChuya()">中原中也</button>

  <div id="result"></div>


  <div id="secondQuestion">

    <h2>下一篇文章中，你想看见中原中也的相方是：</h2>

    <form id="voteForm">

      <input
        type="hidden"
        name="教师节最想感谢的人"
        value="中原中也"
      >

      <label class="option">
        <input
          type="radio"
          name="中原中也的相方"
          value="森鸥外"
          required
        >
        森鸥外
      </label>

      <label class="option">
        <input
          type="radio"
          name="中原中也的相方"
          value="魏尔伦"
        >
        魏尔伦
      </label>

      <label class="option">
        <input
          type="radio"
          name="中原中也的相方"
          value="芥川银"
        >
        芥川银
      </label>

      <label class="option">
        <input
          type="radio"
          name="中原中也的相方"
          value="旗会成员"
        >
        旗会成员
      </label>

      <!-- 太宰治：假选项 -->
      <div class="option dazai-option" onclick="chooseSecondDazai()">
        <input
          type="radio"
          id="secondDazaiRadio"
          tabindex="-1"
        >
        <span id="secondDazaiText">太宰治</span>

        <div id="dazaiMessage">
          中也很贪心呢……
        </div>
      </div>


      <textarea
        name="醒脾"
        id="comment"
        placeholder="请输入你的醒脾"
      ></textarea>

      <br>

      <button type="submit">
        提交
      </button>

    </form>

    <div id="submitResult"></div>

  </div>


  <script>

    function chooseDazai() {
      document.getElementById("result").innerText =
        "做得很好，芥川君";

      document.getElementById("secondQuestion").style.display =
        "none";
    }


    function chooseChuya() {
      document.getElementById("result").innerHTML =
        "中原中也，从我的网站滚出去。<br>" +
        "不过你看上去很想被感激噢，干部大人。<br>" +
        "^_^<br>" +
        "作为你曾经的搭档，稍微帮帮中也也无所谓。";

      document.getElementById("secondQuestion").style.display =
        "block";
    }


    function chooseSecondDazai() {

      const radio =
        document.getElementById("secondDazaiRadio");

      const text =
        document.getElementById("secondDazaiText");

      const message =
        document.getElementById("dazaiMessage");


      radio.checked = false;
      radio.disabled = true;

      text.classList.add("dazai-crossed");

      message.style.display = "block";
    }


    const form = document.getElementById("voteForm");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const submitResult =
        document.getElementById("submitResult");

      submitResult.innerText = "提交中……";

      const formData = new FormData(form);

      try {

        const response = await fetch(
          "https://formspree.io/f/xqpkwnbo",
          {
            method: "POST",
            body: formData,
            headers: {
              "Accept": "application/json"
            }
          }
        );

        if (response.ok) {

          submitResult.innerText =
            "提交成功！我已经看到你的醒脾了。";

          form.reset();

        } else {

          submitResult.innerText =
            "提交失败，请再试一次。";

        }

      } catch (error) {

        submitResult.innerText =
          "提交失败，请检查网络后再试。";

      }

    });

  </script>

</body>
</html>
